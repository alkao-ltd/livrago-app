<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>LivraGo</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#1e88e5">
  <style>
    body { font-family: sans-serif; margin: 0; padding: 12px; background: #f4f6f8; }
    h1 { color: #1e88e5; margin: 0 0 12px; }
    input { width: 100%; box-sizing: border-box; padding: 10px; margin-bottom: 8px; font-size: 16px; }
    button { padding: 12px; font-size: 16px; background: #1e88e5; color: #fff; border: 0; border-radius: 6px; }
    #ajout { width: 100%; }
    #installzone { display: none; background: #e3f2fd; border-left: 6px solid #1e88e5; padding: 10px; margin-bottom: 12px; border-radius: 6px; line-height: 1.5; }
    #resume { background: #fff; border-left: 6px solid #2e7d32; padding: 10px; margin-bottom: 12px; border-radius: 6px; line-height: 1.6; }
    .client { background: #fff; padding: 10px; margin-top: 10px; border-radius: 6px; }
    .client.livre { background: #e8f5e9; }
    .etat { margin: 6px 0 2px; font-weight: bold; }
    .pos { margin: 2px 0 6px; font-size: 14px; color: #555; }
    .boutons { display: flex; flex-wrap: wrap; gap: 6px; }
    .boutons button { flex: 1 1 45%; padding: 10px 6px; font-size: 14px; }
    .rouge { background: #e53935; }
    .gris { background: #757575; }
    .vert { background: #2e7d32; }
  </style>
</head>
<body>
  <h1>LivraGo</h1>

  <div id="installzone"></div>

  <div id="resume"></div>

  <input id="nom" placeholder="Nom du client">
  <input id="adresse" placeholder="Adresse">
  <input id="tel" type="tel" placeholder="Téléphone">
  <input id="produit" placeholder="Quoi livrer ?">
  <input id="montant" type="number" inputmode="numeric" placeholder="Montant (FCFA)">
  <button id="ajout" onclick="ajouter()">Ajouter le client</button>

  <div id="liste"></div>

  <script>
    var clients = [];
    try {
      clients = JSON.parse(localStorage.getItem("livrago_clients")) || [];
    } catch (e) {
      clients = [];
    }

    var installEvent = null;

    function sauver() {
      localStorage.setItem("livrago_clients", JSON.stringify(clients));
    }

    function bouton(texte, classe, action) {
      var b = document.createElement("button");
      b.textContent = texte;
      if (classe) { b.className = classe; }
      b.onclick = action;
      return b;
    }

    function dejaInstalle() {
      return window.matchMedia("(display-mode: standalone)").matches || window.navigator.standalone === true;
    }

    function afficherInstall(message, avecBouton) {
      var zone = document.getElementById("installzone");
      zone.innerHTML = "";
      zone.style.display = "block";
      var t = document.createElement("div");
      t.textContent = message;
      zone.appendChild(t);
      if (avecBouton) {
        var b = bouton("Installer LivraGo", "vert", function () {
          if (!installEvent) { return; }
          installEvent.prompt();
          installEvent.userChoice.then(function () {
            installEvent = null;
            zone.style.display = "none";
          });
        });
        b.style.width = "100%";
        b.style.marginTop = "8px";
        zone.appendChild(b);
      }
    }

    function verifierInstall() {
      if (dejaInstalle()) { return; }
      var ua = navigator.userAgent;
      if (/FBAN|FBAV|Instagram|TikTok|musical_ly|Bytedance|Snapchat|; wv\)/i.test(ua)) {
        afficherInstall("Pour installer LivraGo, ouvrez ce lien dans Chrome : appuyez sur les trois points, puis sur « Ouvrir dans Chrome » ou « Ouvrir dans le navigateur ».", false);
        return;
      }
      if (/iPhone|iPad|iPod/i.test(ua)) {
        afficherInstall("Sur iPhone : ouvrez ce lien dans Safari, appuyez sur le bouton Partager, puis sur « Sur l'écran d'accueil ».", false);
      }
    }

    window.addEventListener("beforeinstallprompt", function (e) {
      e.preventDefault();
      installEvent = e;
      if (!dejaInstalle()) {
        afficherInstall("Installez LivraGo sur votre téléphone : il marchera comme une application, même sans internet.", true);
      }
    });

    window.addEventListener("appinstalled", function () {
      document.getElementById("installzone").style.display = "none";
    });

    function marquerPosition(c) {
      if (!navigator.geolocation) {
        alert("Le GPS n'est pas disponible sur ce téléphone.");
        return;
      }
      alert("Restez devant la maison. Appuyez sur OK, puis attendez quelques secondes.");
      navigator.geolocation.getCurrentPosition(
        function (p) {
          c.lat = p.coords.latitude;
          c.lng = p.coords.longitude;
          c.precision = Math.round(p.coords.accuracy);
          sauver();
          afficher();
        },
        function (err) {
          if (err.code === 1) {
            alert("Position refusée. Autorisez la localisation pour ce site dans les réglages.");
          } else {
            alert("Position introuvable. Allez à l'extérieur et réessayez.");
          }
        },
        { enableHighAccuracy: true, timeout: 30000, maximumAge: 0 }
      );
    }

    function yAller(c) {
      var url = "https://www.google.com/maps/dir/?api=1&destination=" + c.lat + "," + c.lng + "&travelmode=driving";
      window.open(url, "_blank");
    }

    function afficherResume() {
      var faites = 0;
      var encaisse = 0;
      var reste = 0;
      clients.forEach(function (c) {
        var m = Number(c.montant) || 0;
        if (c.livre) { faites++; }
        if (c.paye) { encaisse += m; } else { reste += m; }
      });
      var r = document.getElementById("resume");
      r.innerHTML = "";
      var l1 = document.createElement("div");
      l1.textContent = "Livraisons faites : " + faites + " sur " + clients.length;
      var l2 = document.createElement("div");
      l2.textContent = "Argent encaissé : " + encaisse + " FCFA";
      var l3 = document.createElement("div");
      l3.textContent = "Reste à encaisser : " + reste + " FCFA";
      r.appendChild(l1);
      r.appendChild(l2);
      r.appendChild(l3);
    }

    function afficher() {
      afficherResume();
      var liste = document.getElementById("liste");
      liste.innerHTML = "";
      clients.forEach(function (c, i) {
        var div = document.createElement("div");
        div.className = "client" + (c.livre ? " livre" : "");

        var infos = document.createElement("div");
        infos.textContent = c.nom + " | " + c.adresse + " | " + c.tel + " | " + c.produit + " | " + (Number(c.montant) || 0) + " FCFA";

        var etat = document.createElement("div");
        etat.className = "etat";
        etat.textContent = (c.livre ? "Livré" : "À livrer") + " - " + (c.paye ? "Payé" : "Non payé");

        var pos = document.createElement("div");
        pos.className = "pos";
        if (c.lat) {
          pos.textContent = "Position enregistrée (précision " + c.precision + " m)";
        } else {
          pos.textContent = "Position non marquée";
        }

        var boutons = document.createElement("div");
        boutons.className = "boutons";

        boutons.appendChild(bouton(c.livre ? "Pas livré" : "Livré", "", function () {
          c.livre = !c.livre;
          sauver();
          afficher();
        }));

        boutons.appendChild(bouton(c.paye ? "Pas payé" : "Payé", "", function () {
          c.paye = !c.paye;
          sauver();
          afficher();
        }));

        boutons.appendChild(bouton(c.lat ? "Marquer à nouveau" : "Marquer position", "vert", function () {
          marquerPosition(c);
        }));

        if (c.lat) {
          boutons.appendChild(bouton("Y aller", "", function () {
            yAller(c);
          }));
        }

        boutons.appendChild(bouton("Modifier", "gris", function () {
          var nom = prompt("Nom du client", c.nom);
          if (nom === null) { return; }
          var adresse = prompt("Adresse", c.adresse);
          if (adresse === null) { return; }
          var tel = prompt("Téléphone", c.tel);
          if (tel === null) { return; }
          var produit = prompt("Quoi livrer ?", c.produit);
          if (produit === null) { return; }
          var montant = prompt("Montant (FCFA)", Number(c.montant) || 0);
          if (montant === null) { return; }
          c.nom = nom.trim();
          c.adresse = adresse.trim();
          c.tel = tel.trim();
          c.produit = produit.trim();
          c.montant = Number(montant) || 0;
          sauver();
          afficher();
        }));

        boutons.appendChild(bouton("Supprimer", "rouge", function () {
          if (confirm("Supprimer " + c.nom + " ?")) {
            clients.splice(i, 1);
            sauver();
            afficher();
          }
        }));

        div.appendChild(infos);
        div.appendChild(etat);
        div.appendChild(pos);
        div.appendChild(boutons);
        liste.appendChild(div);
      });
    }

    function ajouter() {
      var nom = document.getElementById("nom").value.trim();
      if (nom === "") { return; }
      clients.push({
        nom: nom,
        adresse: document.getElementById("adresse").value.trim(),
        tel: document.getElementById("tel").value.trim(),
        produit: document.getElementById("produit").value.trim(),
        montant: Number(document.getElementById("montant").value) || 0,
        livre: false,
        paye: false
      });
      sauver();
      afficher();
      document.getElementById("nom").value = "";
      document.getElementById("adresse").value = "";
      document.getElementById("tel").value = "";
      document.getElementById("produit").value = "";
      document.getElementById("montant").value = "";
    }

    afficher();
    verifierInstall();

    if ("serviceWorker" in navigator) {
      navigator.serviceWorker.register("sw.js");
    }
  <script>
setTimeout(function(){
  var lien="https://alkao-ltd.github.io/livrago-app/";
  var boite=null;
  var els=document.querySelectorAll("div,p,section");
  for(var i=0;i<els.length;i++){
    if(els[i].textContent.indexOf("Pour installer LivraGo")>-1 && !els[i].querySelector("div,p,section")){ boite=els[i]; break; }
  }
  if(!boite) return;
  var b=document.createElement("button");
  b.textContent="Copier le lien";
  b.style.cssText="display:block;margin-top:10px;padding:12px 18px;font-size:16px;background:#1e88e5;color:#fff;border:0;border-radius:8px;";
  b.onclick=function(){
    function ok(){b.textContent="Lien copié ! Collez-le dans Chrome";}
    function vieux(){
      var t=document.createElement("textarea");
      t.value=lien;
      document.body.appendChild(t);
      t.select();
      try{document.execCommand("copy");ok();}catch(e){b.textContent="Copie impossible";}
      document.body.removeChild(t);
    }
    if(navigator.clipboard&&navigator.clipboard.writeText){
      navigator.clipboard.writeText(lien).then(ok,vieux);
    }else{vieux();}
  };
  boite.appendChild(b);
},800);
  </script>
</body>
  </html>
